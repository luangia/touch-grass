# Continuous integration (D-026 Q4): the same commands as locally, on a clean machine.
# The pipeline's `-m data` tests need ~600 MB of raw downloads and skip themselves here;
# the `-m db` tests run against the PostGIS service container.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.2"
  NODE_VERSION: "25"
  # Read by the pipeline's and the API's settings (POSTGRES_*), as with the local .env.
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_USER: touchgrass
  POSTGRES_PASSWORD: ci-only-not-a-secret
  POSTGRES_DB: touchgrass

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: touchgrass
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: touchgrass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U touchgrass -d touchgrass"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run touchgrass regions validate portland-or
      - run: uv run pytest

  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: touchgrass
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: touchgrass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U touchgrass -d touchgrass"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            api/uv.lock
            pipeline/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    # The built web app against a real API over the synthetic test region (D-026 Q5).
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: touchgrass
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: touchgrass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U touchgrass -d touchgrass"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            api/uv.lock
            pipeline/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: uv sync --frozen
        working-directory: api
      - run: npm ci
        working-directory: web
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  audit:
    # Known vulnerabilities in the locked dependencies. Reports only (D-026 Q4).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pip-audit (pipeline, api)
        run: |
          for p in pipeline api; do
            (cd "$p" && uv export --frozen --no-dev --no-hashes --no-emit-project \
              --no-emit-local > "$RUNNER_TEMP/$p-requirements.txt")
            uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/$p-requirements.txt" || true
          done
      - name: npm audit (web, production dependencies)
        working-directory: web
        run: npm audit --omit=dev || true
