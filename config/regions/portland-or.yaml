# Region config: City of Portland, Oregon (DECISIONS.md D-001).
# Everything Portland-specific lives here. Code reads it via touchgrass.config.
# Census (TIGER/ACS) URLs are derived in code from state_fips + vintages; only
# city-published layers are listed here. Parks are added in Stage 3.

region_id: portland-or
name: Portland, Oregon
country: US

# NAD83 / UTM zone 10N: projected, meters, scale error < ~0.1% across Portland (D-008).
analysis_crs: 26910

# Rough city center (lon, lat). Only used to check that analysis_crs covers the region.
center_lonlat: [-122.65, 45.54]

# Census identifiers. Portland lies mostly in Multnomah (051), with small parts in
# Washington (067) and Clackamas (005) counties.
state_fips: "41"
county_fips: ["051", "067", "005"]

# Pull walk network and parks from this far beyond the city limits so residents near
# the edge can reach parks just outside (edge effect, D-001).
buffer_m: 2000

analysis:
  walk_speed_kmh: 4.8      # 80 m/min → 5/10/15 min ≈ 400/800/1200 m
  thresholds_min: [5, 10, 15]
  max_snap_m: 500

# City limits. The layer holds all Metro-area cities; the server filters to Portland.
study_boundary:
  adapter: arcgis_feature_layer
  url: https://www.portlandmaps.com/od/rest/services/COP_OpenData_Boundary/MapServer/10
  where: "CITYNAME = 'Portland'"
  # RLIS Open Database EULA (2023-02-01) requires this statement + a link to the licence.
  attribution: >-
    Regional Land Information System data are a product of Metro and made publicly available according to the license agreement found in https://rlisdiscovery.oregonmetro.gov/pages/open-database-license

analysis_areas:
  # One polygon per neighborhood association; shared areas overlap (D-015 Q1).
  # ID 0 = the four 'MC UNCLAIMED' areas, excluded (D-015 Q2).
  - area_type: neighborhood
    adapter: arcgis_feature_layer
    url: https://www.portlandmaps.com/od/rest/services/COP_OpenData_Boundary/MapServer/125
    where: "ID <> 0"
    key_field: ID
    name_field: NAME
    allow_overlaps: true
    attribution: City of Portland Bureau of Planning and Sustainability

  # Built from 2020 census blocks; pop_total reconciles our block sums (D-015 Q3).
  - area_type: council_district
    adapter: arcgis_feature_layer
    url: https://www.portlandmaps.com/od/rest/services/COP_OpenData_Boundary/MapServer/1413
    key_field: DISTRICT
    name_field: DISTRICT
    allow_overlaps: false
    population_check_field: pop_total
    attribution: City of Portland City Elections Office

census:
  decennial_vintage: 2020
  acs:
    year: 2024 # ACS 5-year 2020–2024
    # Total population; median household income; Hispanic/Latino origin by race;
    # tenure by vehicles available (D-015 Q4).
    tables: [B01003, B19013, B03002, B25044]

validation:
  expected_population: 652503 # 2020 Census, City of Portland (P.L. 94-171)
  population_tolerance: 0.01

# OpenStreetMap: a dated, checksummed Geofabrik extract (D-017). Bump deliberately.
osm:
  geofabrik_path: north-america/us/oregon
  snapshot: "261101" # oregon-261101.osm.pbf = 1 Nov 2026

# What counts as public green space (D-018). Excluded candidates are kept with a reason.
parks:
  include_tags:
    leisure: [park, nature_reserve, dog_park, common]
    boundary: [protected_area] # Washington Park is tagged only this way
    landuse: [recreation_ground, village_green]
  natural_area_tags:
    leisure: [nature_reserve] # Forest Park is a nature reserve, not leisure=park
    boundary: [protected_area]
  exclude_tags:
    not_open_space:
      leisure: [golf_course]
      landuse: [cemetery]
      tourism: [zoo] # fee-charging; the Oregon Zoo sits inside Washington Park
    land_cover_not_a_park:
      landuse: [grass, forest, meadow]
    amenity_usually_in_park_or_school:
      leisure: [pitch, playground, sports_centre, track]
    garden_fee_membership_or_private:
      leisure: [garden]
  exclude_access: [private, "no"]
  # Overrule an include tag (D-018 amendment 2). Found while querying PostGIS in Stage 4:
  # Pioneer Courthouse and Aubrey Watzek House are buildings, and the US Government Moorings
  # Historic District is a heritage site; OSM tags all three boundary=protected_area.
  veto_tags:
    building_not_open_space: # indoor or built, e.g. Fido's Indoor Dog Park
      tags:
        building: ["*"]
    heritage_site_not_park: # protected for history, not as green space
      tags:
        protect_class: ["22"]
        protection_title: [protected_site]
      unless: # a real park that is also historic (e.g. Willamette Stone State Heritage Site)
        leisure: [park, nature_reserve, dog_park, common]
        landuse: [recreation_ground, village_green]
  # Cut these out of park outlines that enclose them (D-018 amendment): e.g. the Heron
  # Lakes golf courses inside Delta Park West, the zoo inside Washington Park.
  subtract_reasons: [not_open_space]
  min_area_m2: 400
  # Metro ORCA parks and natural areas, used only to measure agreement (D-003).
  validation_source:
    adapter: arcgis_feature_layer
    url: https://services2.arcgis.com/McQ0OlIABe29rJJy/arcgis/rest/services/Outdoor_Recreation_and_Conservation_Areas_ORCA/FeatureServer/5
    where: "UNITTYPE IN ('Park','Natural Area') AND STATUS <> 'Planned'"
    attribution: >-
      Regional Land Information System data are a product of Metro and made publicly available according to the license agreement found in https://rlisdiscovery.oregonmetro.gov/pages/open-database-license
  # Large, well-known parks that must survive the rules (catches tag surprises).
  sentinel_parks:
    - Forest Park
    - Washington Park
    - Mount Tabor Park
    - Laurelhurst Park
    - Powell Butte Nature Park
