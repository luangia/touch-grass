<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TouchGrass — walkable park access</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Theme before first paint (see src/theme.ts): saved choice, else the system setting.
      (function () {
        var t = null;
        try { t = localStorage.getItem("touchgrass-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark")
          t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
