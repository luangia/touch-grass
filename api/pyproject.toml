[project]
name = "touchgrass-api"
version = "0.1.0"
description = "Read-only HTTP API over the TouchGrass PostGIS database"
authors = [
    { name = "Luan Pham", email = "35203166+luangia@users.noreply.github.com" }
]
requires-python = ">=3.12"
# Deliberately small: the API never imports the pipeline (DECISIONS.md D-023 Q1).
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",               # FastAPI's TestClient
    "mapbox-vector-tile>=2.0",   # decode MVT in tests
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "touchgrass",                # test seeding only: build + load the synthetic region
]

[tool.uv]
# Same supply-chain cutoff as the pipeline (D-014).
exclude-newer = "2026-11-08T00:00:00Z"
python-preference = "only-managed"

[tool.uv.sources]
touchgrass = { path = "../pipeline", editable = true }

# ---------- tooling ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/parameter declarations are function-call defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# The pipeline (dev-only, test seeding) ships no py.typed marker.
module = ["mapbox_vector_tile.*", "geopandas.*", "pandas.*", "shapely.*", "touchgrass.*", "tests.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette's TestClient still works on httpx; the httpx2 move is upstream's to make.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "data: runs against the real loaded database (dev DB); skipped when it has no regions",
]
